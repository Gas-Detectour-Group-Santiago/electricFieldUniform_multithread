scan_mode: field
measure_gas_transport: false
record_excitation_positions: true
space_charge: false

# Four fixed-field simulations per composition:
# E_ref, 0.90 E_ref, 0.75 E_ref and 0.50 E_ref.
field_sets:
  - components: {ar: 90, cf4: 10}
    pressures_bar: [1]
    gap_mm: 0.150
    reference_field_kv_cm: 39.8
    field_scales: [1.0, 0.9, 0.75, 0.5]

  - components: {ar: 85, cf4: 15}
    pressures_bar: [1]
    gap_mm: 0.150
    reference_field_kv_cm: 43
    field_scales: [1.0, 0.9, 0.75, 0.5]

  - components: {ar: 80, cf4: 20}
    pressures_bar: [1]
    gap_mm: 0.150
    reference_field_kv_cm: 44
    field_scales: [1.0, 0.9, 0.75, 0.5]

  - components: {ar: 95, cf4: 3, iso: 2}
    pressures_bar: [1]
    gap_mm: 0.150
    reference_field_kv_cm: 29
    field_scales: [1.0, 0.9, 0.75, 0.5]

  - components: {ar: 77, cf4: 20, iso: 3}
    pressures_bar: [1]
    gap_mm: 0.150
    reference_field_kv_cm: 39
    field_scales: [1.0, 0.9, 0.75, 0.5]

  - components: {ar: 78, cf4: 20, iso: 2}
    pressures_bar: [1]
    gap_mm: 0.150
    reference_field_kv_cm: 39
    field_scales: [1.0, 0.9, 0.75, 0.5]

  - components: {ar: 87, cf4: 10, iso: 3}
    pressures_bar: [1]
    gap_mm: 0.150
    reference_field_kv_cm: 34.6
    field_scales: [1.0, 0.9, 0.75, 0.5]

  - components: {ar: 88, cf4: 10, iso: 2}
    pressures_bar: [1]
    gap_mm: 0.150
    reference_field_kv_cm: 34
    field_scales: [1.0, 0.9, 0.75, 0.5]

  - components: {ar: 95, iso: 5}
    pressures_bar: [1]
    gap_mm: 0.150
    reference_field_kv_cm: 29
    field_scales: [1.0, 0.9, 0.75, 0.5]

  - components: {ar: 96, iso: 4}
    pressures_bar: [1]
    gap_mm: 0.150
    reference_field_kv_cm: 29
    field_scales: [1.0, 0.9, 0.75, 0.5]

# Fixed statistics: every requested field is simulated with exactly 100
# primary electrons. Field mode never changes the requested electric field.
npe: 100
workers: 2
