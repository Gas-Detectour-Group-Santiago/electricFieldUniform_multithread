scan_mode: field

measure_gas_transport: false
record_excitation_positions: false
space_charge: false
penning: true

# Ar/Xe 99/1 at 4 bar.
# Requested reduced fields E/P [kV/cm/bar]:
# 1.25, 1.50, 1.75, 2.00, 2.25, 2.50, 2.75
#
# At 4 bar these correspond to E [kV/cm]:
# 5, 6, 7, 8, 9, 10, 11
#
# With a 5 mm = 0.5 cm gap, the corresponding voltages are:
# 2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5 kV.
field_sets:
  - components: {ar: 99, xe: 1}
    pressures_bar: [4]
    gap_mm: 5.0
    fields_kv_cm: [11, 10, 9, 8, 5, 6, 7 ]

# Fixed statistics: each requested field is simulated with exactly
# 100 primary electrons.
npe: 10
workers: 2
