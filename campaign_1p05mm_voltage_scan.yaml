scan_mode: field
measure_gas_transport: false
record_excitation_positions: true
space_charge: false

# Fixed-field campaign corresponding to the experimental voltages V1, V2 and V3.
# V0 = 0 V is intentionally excluded.
# Conversion used for every point:
#   E [kV/cm] = V [V] / (100 * gap [mm]) = V / 105
# for gap = 1.05 mm.
field_sets:
  # Ar/CF4, 0.1% CF4, 1 bar; V = [800, 1000, 1100] V
  - components: {ar: 99.9, cf4: 0.1}
    pressures_bar: [1]
    gap_mm: 1.05
    fields_kv_cm: [7.619048, 9.523810, 10.476190]

